suite: secret interface
templates:
  - deployment.yaml
  - secret.yaml
set:
  config.originApp: https://app.example.com
  config.originBackend: https://api.example.com
  config.oidc.issuerUrl: https://idp.example.com
  config.oidc.clientId: threatsea
  secret.values.jwtSecret: jwt
  secret.values.sessionSecret: session
  secret.values.oidcClientSecret: oidc
  secret.values.databasePassword: dbpw
  database.host: db.example.com
tests:
  - it: creates a secret when no existing one is named
    template: secret.yaml
    release: { name: rel }
    asserts:
      - hasDocuments: { count: 1 }
      - equal: { path: metadata.name, value: rel-threatsea }

  - it: creates no secret when an existing one is named
    template: secret.yaml
    set:
      secret.existingSecret: my-secret
    asserts:
      - hasDocuments: { count: 0 }

  - it: reads every secret from the existing one when named
    template: deployment.yaml
    set:
      secret.existingSecret: my-secret
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="JWT_SECRET")].valueFrom.secretKeyRef.name
          value: my-secret
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="EXPRESS_SESSION_SECRET")].valueFrom.secretKeyRef.name
          value: my-secret

  # Rendering cannot look inside an existing Secret, so the key names the chart
  # will read must be visible in the manifest and overridable.
  - it: reads the documented key names, so a missing key is diagnosable
    template: deployment.yaml
    set:
      secret.existingSecret: my-secret
      secret.keys.jwtSecret: custom-jwt-key
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="JWT_SECRET")].valueFrom.secretKeyRef.key
          value: custom-jwt-key

  - it: rejects secret.create, which no longer exists
    set:
      secret.create: true
    asserts:
      - failedTemplate:
          errorPattern: "additional properties .create. not allowed"
