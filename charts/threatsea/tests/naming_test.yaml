suite: naming and labels
templates:
  - deployment.yaml
  - secret.yaml
  - service.yaml
set:
  config.originApp: https://app.example.com
  config.originBackend: https://api.example.com
  config.oidc.issuerUrl: https://idp.example.com
  config.oidc.clientId: threatsea
  secret.values.jwtSecret: jwt
  secret.values.sessionSecret: session
  secret.values.oidcClientSecret: oidc
  secret.values.databasePassword: dbpw
  database.host: db.example.com
  database.user: appuser
tests:
  - it: names resources after the release and chart
    template: service.yaml
    release:
      name: rel
    asserts:
      - equal:
          path: metadata.name
          value: rel-threatsea

  - it: honours fullnameOverride
    template: service.yaml
    set:
      fullnameOverride: foo
    asserts:
      - equal:
          path: metadata.name
          value: foo

  - it: carries the standard selector labels
    template: deployment.yaml
    release:
      name: rel
    asserts:
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: threatsea
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/instance"]
          value: rel

  - it: fails when jwtSecret is empty
    template: secret.yaml
    set:
      secret.values.jwtSecret: ""
    asserts:
      - failedTemplate:
          errorPattern: secret.values.jwtSecret must not be empty

  # Helm injects `global` into every subchart's values; the schema must accept it.
  - it: accepts global values injected by a parent chart
    template: service.yaml
    set:
      global.foo: bar
    asserts:
      - isKind:
          of: Service
