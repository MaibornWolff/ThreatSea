suite: typed config values
templates:
  - deployment.yaml
  - secret.yaml
set:
  config.originApp: https://app.example.com
  config.originBackend: https://api.example.com
  config.oidc.issuerUrl: https://idp.example.com
  config.oidc.clientId: threatsea
  secret.values.jwtSecret: jwt
  secret.values.sessionSecret: session
  secret.values.oidcClientSecret: oidc
  secret.values.databasePassword: dbpw
  database.host: db.example.com
tests:
  # Finding 3: the backend treats anything but exactly "oidc" as fixed-profile
  # auth with hardcoded test users, so a typo must not render.
  - it: rejects an authMethod that is not exactly oidc or fixed
    set:
      config.authMethod: OIDC
    asserts:
      - failedTemplate:
          errorPattern: "authMethod.*value must be one of"

  - it: rejects a trailing space in authMethod
    set:
      config.authMethod: "oidc "
    asserts:
      - failedTemplate:
          errorPattern: "authMethod.*value must be one of"

  # Finding 8
  - it: requires originApp
    template: deployment.yaml
    set:
      config.originApp: ""
    asserts:
      - failedTemplate:
          errorPattern: config.originApp is required

  - it: requires originBackend
    template: deployment.yaml
    set:
      config.originBackend: ""
    asserts:
      - failedTemplate:
          errorPattern: config.originBackend is required

  # Finding 11
  - it: maps native booleans to the strings the backend reads
    template: deployment.yaml
    set:
      config.cookies.secure: true
      config.useProxy: true
      config.oidc.allowHttp: false
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: COOKIES_SECURE_OPTION, value: "enabled"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: USE_PROXY, value: "true"}}
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: OIDC_ALLOW_HTTP, value: "false"}}

  - it: maps cookies.secure false to disabled
    template: deployment.yaml
    set:
      config.cookies.secure: false
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: COOKIES_SECURE_OPTION, value: "disabled"}}

  # Review Focus 2: 0 is a documented log level and is falsy in Go templates.
  - it: renders log level 0 rather than dropping it
    template: deployment.yaml
    set:
      config.logLevel: 0
    asserts:
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: LOG_LEVEL, value: "0"}}

  - it: rejects a log level outside 0-3
    set:
      config.logLevel: 7
    asserts:
      - failedTemplate:
          errorPattern: "logLevel"

  - it: rejects a string log level
    set:
      config.logLevel: "3"
    asserts:
      - failedTemplate:
          errorPattern: "got string, want integer"

  - it: rejects an unknown top-level value
    set:
      configg: {}
    asserts:
      - failedTemplate:
          errorPattern: "additional properties .configg. not allowed"

  # Review Focus 5
  - it: rejects database.host together with the bundled database
    template: deployment.yaml
    set:
      postgresql.enabled: true
      postgresql.auth.password: pw
      database.host: db.example.com
    asserts:
      - failedTemplate:
          errorPattern: database.host must not be set when postgresql.enabled=true
