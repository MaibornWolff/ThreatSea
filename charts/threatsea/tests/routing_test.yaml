suite: routing, service and probes
templates:
  - ingress.yaml
  - httproute.yaml
  - service.yaml
  - deployment.yaml
  - secret.yaml
set:
  config.originApp: https://app.example.com
  config.originBackend: https://api.example.com
  config.oidc.issuerUrl: https://idp.example.com
  config.oidc.clientId: threatsea
  secret.values.jwtSecret: jwt
  secret.values.sessionSecret: session
  secret.values.oidcClientSecret: oidc
  secret.values.databasePassword: dbpw
  database.host: db.example.com
tests:
  - it: quotes the ingress class name and path
    template: ingress.yaml
    set:
      ingress.enabled: true
      ingress.className: nginx
    asserts:
      - equal: { path: spec.ingressClassName, value: nginx }
      - equal: { path: "spec.rules[0].http.paths[0].path", value: "/" }

  - it: refuses both routing options at once
    template: ingress.yaml
    set:
      ingress.enabled: true
      gateway.enabled: true
      gateway.gatewayName: gw
    asserts:
      - failedTemplate:
          errorPattern: ingress.enabled and gateway.enabled are mutually exclusive

  - it: routes several hostnames through the gateway
    template: httproute.yaml
    set:
      gateway.enabled: true
      gateway.gatewayName: gw
      gateway.hostnames: [a.example.com, b.example.com]
    asserts:
      - equal: { path: spec.hostnames, value: [a.example.com, b.example.com] }

  - it: passes sectionName and annotations to the HTTPRoute
    template: httproute.yaml
    set:
      gateway.enabled: true
      gateway.gatewayName: gw
      gateway.sectionName: https
      gateway.annotations: { team: security }
    asserts:
      - equal: { path: "spec.parentRefs[0].sectionName", value: https }
      - equal: { path: metadata.annotations.team, value: security }

  - it: annotates the service when asked
    template: service.yaml
    set:
      service.annotations: { "cloud.example.com/lb": "internal" }
    asserts:
      - equal: { path: 'metadata.annotations["cloud.example.com/lb"]', value: internal }

  - it: takes a deployment strategy
    template: deployment.yaml
    set:
      strategy: { type: Recreate }
    asserts:
      - equal: { path: spec.strategy.type, value: Recreate }

  - it: sets no initialDelaySeconds on the liveness and readiness probes
    template: deployment.yaml
    asserts:
      - notExists: { path: "spec.template.spec.containers[0].livenessProbe.initialDelaySeconds" }
      - notExists: { path: "spec.template.spec.containers[0].readinessProbe.initialDelaySeconds" }
      - exists: { path: "spec.template.spec.containers[0].startupProbe" }
