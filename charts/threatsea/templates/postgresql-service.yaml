{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "threatsea.postgresql.fullname" . }}
  labels:
    {{- include "threatsea.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    {{- include "threatsea.postgresql.selectorLabels" . | nindent 4 }}
{{- end }}
