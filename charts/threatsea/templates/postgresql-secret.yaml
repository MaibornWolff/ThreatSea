{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "threatsea.postgresql.fullname" . }}
  labels:
    {{- include "threatsea.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ required "postgresql.auth.password must be set when postgresql.enabled=true and postgresql.auth.existingSecret is empty" .Values.postgresql.auth.password | quote }}
{{- end }}
