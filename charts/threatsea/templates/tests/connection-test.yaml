apiVersion: v1
kind: Pod
metadata:
  name: {{ include "threatsea.fullname" . }}-connection-test
  labels:
    {{- include "threatsea.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: psql
      image: {{ include "threatsea.postgresql.image" . | quote }}
      imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
      command:
        - psql
        - -X
        - -v
        - ON_ERROR_STOP=1
        - -c
        - SELECT 1
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      env:
        - name: PGHOST
          value: {{ include "threatsea.databaseHost" . | quote }}
        - name: PGPORT
          value: {{ include "threatsea.databasePort" . | quote }}
        - name: PGUSER
          value: {{ .Values.database.user | quote }}
        - name: PGDATABASE
          value: {{ .Values.database.name | quote }}
        - name: PGSSLMODE
          value: {{ ternary "require" "disable" (eq (include "threatsea.databaseTls" .) "enabled") | quote }}
        - name: PGCONNECT_TIMEOUT
          value: "10"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              {{- include "threatsea.databasePasswordSecretKeyRef" . | nindent 14 }}
