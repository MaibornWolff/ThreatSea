# ──────────────────────────────────────────────
# ThreatSea Helm Chart – Default Values
# ──────────────────────────────────────────────

# -- Number of replicas. Note: ThreatSea should not be scaled horizontally
# unless session affinity or an external session store is configured.
replicaCount: 1

image:
  repository: ghcr.io/maibornwolff/threatsea
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# ──────────────────────────────────────────────
# Application Configuration
# ──────────────────────────────────────────────
config:
  # -- Log level as an integer: 0 (debug), 1 (info), 2 (warning), 3 (error)
  logLevel: 3

  # -- Origin of the frontend (used for CORS and as the post-login redirect target)
  originApp: ""
  # -- Origin of the backend (used to build the OIDC redirect/callback URL).
  # Must be the externally reachable backend URL, otherwise OIDC login fails.
  originBackend: ""

  # -- Authentication method, `oidc` or `fixed`. `fixed` enables fixed-profile
  # authentication with hardcoded test users and is for development only.
  authMethod: "oidc"
  oidc:
    # -- OIDC issuer URL (required when authMethod=oidc)
    issuerUrl: ""
    # -- OIDC client ID
    clientId: ""
    # -- Allow plain HTTP for OIDC (boolean, never enable in production)
    allowHttp: false

  cookies:
    # -- Send cookies with the Secure flag (boolean). Set to false only in
    # development (non-HTTPS).
    secure: true

  # -- Set to true (boolean) when behind a reverse proxy / ingress (enables trust proxy)
  useProxy: true

# ──────────────────────────────────────────────
# Secrets
# ──────────────────────────────────────────────
secret:
  # -- Name of an existing Secret to use. When empty, the chart creates a Secret
  # from secret.values. When set, the chart creates none and the Secret must
  # contain the keys defined in secret.keys.
  existingSecret: ""

  # -- Key names inside the existing Secret (the key names the chart reads from the Secret)
  keys:
    jwtSecret: jwt-secret
    sessionSecret: session-secret
    oidcClientSecret: oidc-client-secret
    databasePassword: database-password

  # -- Values for the chart-created Secret (used only when existingSecret is empty)
  values:
    jwtSecret: ""
    sessionSecret: ""
    # -- OIDC client secret (only required when config.authMethod=oidc)
    oidcClientSecret: ""
    # -- Database password (used only when postgresql.enabled=false and secret.existingSecret is empty)
    databasePassword: ""

# ──────────────────────────────────────────────
# Database
# ──────────────────────────────────────────────
database:
  # -- Hostname of an external PostgreSQL server. Required unless postgresql.enabled=true.
  host: ""
  port: 5432
  # -- Database name. Also the database the bundled PostgreSQL creates.
  name: threatsea
  # -- Database user. Also the user the bundled PostgreSQL creates.
  user: threatsea
  # -- Connect over TLS (boolean). Forced off when postgresql.enabled=true, which serves plaintext.
  tls: true

# ──────────────────────────────────────────────
# Bundled PostgreSQL (evaluation only)
# ──────────────────────────────────────────────
postgresql:
  # -- Deploy a single-replica PostgreSQL StatefulSet. EVALUATION ONLY: no backups,
  # no replication, no TLS, and no supported upgrade path between major versions.
  enabled: false
  image:
    repository: postgres
    tag: "18.6-alpine"
    pullPolicy: IfNotPresent
  auth:
    # -- Password for database.user. Required when enabled=true and existingSecret is empty.
    password: ""
    # -- Existing Secret holding the password, instead of auth.password.
    existingSecret: ""
    existingSecretPasswordKey: password
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# ──────────────────────────────────────────────
# Service
# ──────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  containerPort: 8000

# ──────────────────────────────────────────────
# Ingress
# ──────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: threatsea.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: threatsea-tls
  #   hosts:
  #     - threatsea.example.com

# ──────────────────────────────────────────────
# Gateway API (alternative to Ingress)
# Requires the Gateway API CRDs to be installed in the cluster.
# TLS is not configured here: with the Gateway API it terminates on the
# Gateway's listener, which is owned by the cluster operator, not by this chart.
# ──────────────────────────────────────────────
gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  hostname: threatsea.example.com

# ──────────────────────────────────────────────
# Resources
# ──────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

# ──────────────────────────────────────────────
# Probes
# ──────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 30

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules
affinity: {}

# -- Extra environment variables to inject into the container
extraEnv: []

# -- Extra environment sources (configMapRef / secretRef) added to the container's `envFrom`
extraEnvFrom: []

# -- Extra volumes added to the pod, e.g. to mount a private CA bundle (the root filesystem is read-only)
extraVolumes: []

# -- Extra volume mounts added to the container; each must match a volume in `extraVolumes`
extraVolumeMounts: []
