name: Chart

on:
  push:
    branches:
      - main
      - next
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"

jobs:
  chart:
    name: Lint, Test and Render
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      # The SHA-256 values must be updated together with the version
      # (take them from the release's checksum file); a bump that leaves
      # them stale fails the download check below.
      # renovate: datasource=github-releases depName=helm-unittest/helm-unittest
      HELM_UNITTEST_VERSION: v1.1.2
      # From the release's unittest-<version>.tgz.prov
      HELM_UNITTEST_SHA256: f3f6e4bcfbb73bf573434444af4ea506caaeb6f71dbb9891b499758574dd3161
      # renovate: datasource=github-releases depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      # renovate: datasource=github-releases depName=norwoodj/helm-docs
      HELM_DOCS_VERSION: v1.14.2
      HELM_DOCS_SHA256: a8cf72ada34fad93285ba2a452b38bdc5bd52cc9a571236244ec31022928d6cc
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.0

      - name: Install helm-unittest and kubeconform
        run: |
          curl -sSfL -o "$RUNNER_TEMP/unittest.tgz" "https://github.com/helm-unittest/helm-unittest/releases/download/${HELM_UNITTEST_VERSION}/unittest-${HELM_UNITTEST_VERSION#v}.tgz"
          echo "${HELM_UNITTEST_SHA256}  $RUNNER_TEMP/unittest.tgz" | sha256sum -c -
          # The checksum above pins the plugin; --verify=false only skips Helm's .prov lookup.
          helm plugin install "$RUNNER_TEMP/unittest.tgz" --verify=false
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C /usr/local/bin kubeconform

      - name: Check chart README is up to date
        run: |
          curl -sSfL -o "$RUNNER_TEMP/helm-docs.tar.gz" "https://github.com/norwoodj/helm-docs/releases/download/${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION#v}_Linux_x86_64.tar.gz"
          echo "${HELM_DOCS_SHA256}  $RUNNER_TEMP/helm-docs.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm-docs.tar.gz" -C /usr/local/bin helm-docs
          helm-docs --chart-search-root charts --template-files README.md.gotmpl
          git diff --exit-code -- charts/threatsea/README.md \
            || { echo "::error::charts/threatsea/README.md is stale — run helm-docs and commit the result"; exit 1; }

      - name: Lint chart
        run: helm lint charts/threatsea

      - name: Run chart unit tests
        run: helm unittest charts/threatsea

      - name: Render and validate manifests
        shell: bash
        run: |
          for valuesFile in charts/threatsea/ci/*-values.yaml; do
            echo "::group::$valuesFile"
            helm template release-under-test charts/threatsea --values "$valuesFile" \
              | kubeconform -strict -summary -kubernetes-version 1.30.0 \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/d373c2da9702bc9509a004db83e57263fe3bdfc1/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done

      - name: Verify packaged chart contents
        run: |
          helm package charts/threatsea --version 0.0.0 --app-version 0.0.0 --destination "$RUNNER_TEMP"
          contents=$(tar -tzf "$RUNNER_TEMP/threatsea-0.0.0.tgz")
          echo "$contents" | grep -qx 'threatsea/templates/tests/connection-test.yaml' \
            || { echo "::error::helm test hook missing from the packaged chart (check .helmignore)"; exit 1; }
          if echo "$contents" | grep -q '^threatsea/tests/'; then
            echo "::error::unit test suites leaked into the packaged chart"; exit 1
          fi
