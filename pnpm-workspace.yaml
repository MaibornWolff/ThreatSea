packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": 24.19.0
  "@vitest/coverage-v8": 5.0.3
  dotenv: 18.0.4
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  vitest: 5.0.3

allowBuilds:
  esbuild: false
publicHoistPattern:
  - "oxlint"
  - "oxlint-tsgolint"
minimumReleaseAge: 4320 # time in minutes, equals 72 hours
saveExact: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
patchedDependencies:
  png-js: patches/png-js.patch
