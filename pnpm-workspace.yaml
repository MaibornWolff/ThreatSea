packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": 24.19.2
  "@vitest/coverage-v8": 5.1.0
  dotenv: 18.0.10
  oxlint: 1.92.0
  oxlint-tsgolint: 7.0.2006
  vitest: 5.1.0

allowBuilds:
  esbuild: false
publicHoistPattern:
  - "oxlint"
  - "oxlint-tsgolint"
minimumReleaseAge: 4320 # time in minutes, equals 72 hours
saveExact: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
patchedDependencies:
  png-js: patches/png-js.patch
