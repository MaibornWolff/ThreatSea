packages:
  - "apps/*"
  - "packages/*"
  - "gh-pages"

catalog:
  "@types/node": 24.19.1
  "@vitest/coverage-v8": 4.1.11
  dotenv: 18.0.5
  oxlint: 1.87.0
  oxlint-tsgolint: 7.0.2003
  vitest: 4.1.11

allowBuilds:
  esbuild: false
publicHoistPattern:
  - "oxlint"
  - "oxlint-tsgolint"
minimumReleaseAge: 4320 # time in minutes, equals 72 hours
saveExact: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
patchedDependencies:
  png-js: patches/png-js.patch
overrides:
  # GHSA-rj75-hqrm-r3gf: Starlight pulls in postcss-nested@6 (via expressive-code), which pins the vulnerable
  # postcss-selector-parser@6. Drop once expressive-code moves to postcss-nested@7+.
  "postcss-nested@6>postcss-selector-parser": 7.1.6
