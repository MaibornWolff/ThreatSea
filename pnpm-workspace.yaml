packages:
  - "apps/*"
  - "packages/*"

catalog:
  "@types/node": 26.6.5
  "@vitest/coverage-v8": 4.1.12
  dotenv: 18.0.9
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  vitest: 4.1.12

allowBuilds:
  esbuild: false
publicHoistPattern:
  - "oxlint"
  - "oxlint-tsgolint"
minimumReleaseAge: 4320 # time in minutes, equals 72 hours
saveExact: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1"
patchedDependencies:
  png-js: patches/png-js.patch
